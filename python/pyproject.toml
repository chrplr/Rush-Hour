[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rushhour-gym"
# The version lives in src/rushhour_gym/__init__.py: it is also the release tag
# the package fetches its engine from, so it must match the tag being cut.
dynamic = ["version"]
description = "Rush Hour as a Gymnasium environment, sharing its rules with the psychophysics experiment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Christophe Pallier", email = "christophe@pallier.org" }]
keywords = ["gymnasium", "reinforcement-learning", "rush-hour", "puzzle", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["gymnasium>=1.0", "numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]
rl = ["stable-baselines3>=2.3", "sb3-contrib>=2.3"]

[project.urls]
Homepage = "https://github.com/chrplr/Rush-Hour"

[tool.hatch.version]
path = "src/rushhour_gym/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rushhour_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test should ever hang: the failure mode this package is most exposed to is
# a blocked pipe, which without a timeout looks like a test that never finishes.
timeout = 120
