name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: {}

# go-sdl3 is pure Go (purego, no CGo) and embeds the SDL libraries for every
# platform, and puzzles.txt is embedded too, so every target cross-compiles from
# Linux into a single self-contained, dependency-free binary.
env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x86_64
            ext: ".exe"
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ""
          - goos: linux
            goarch: amd64
            name: linux-x86_64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        if: matrix.goos == 'linux'
        run: |
          go vet ./...
          go test ./...
          # The windowed environment server is behind a build tag, so the
          # default vet/test pass never compiles it. Check it here, or it can
          # rot unnoticed.
          go vet -tags rushui ./...
          go build -tags rushui ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Stamped into each tool's -version flag, into the environment
          # server's handshake, and into the header of every results file they
          # write. Without it a released binary calls itself "dev" (the default
          # in cmd/*/main.go), and a data file cannot say which build produced
          # it -- which defeats the point of recording provenance at all. Only
          # a tag names a release; anything else is stamped with its commit, so
          # a binary handed round outside a release is still traceable.
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA::7}"

          mkdir -p dist/Rush-Hour
          go build -trimpath -ldflags="-s -w" -o "dist/Rush-Hour/Rush-Hour${{ matrix.ext }}" .
          # The environment server, so that users of the Python package can
          # point $RUSHHOUR_ENV_BIN at a prebuilt binary instead of needing a
          # Go toolchain. Headless: no SDL, no window.
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/Rush-Hour/rushhour-env${{ matrix.ext }}" ./cmd/rushhour-env
          # The replay tool, for the same reason. A results file is only worth
          # collecting if it can be read back, so checking one should not
          # require installing Go either.
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/Rush-Hour/rushhour-replay${{ matrix.ext }}" ./cmd/rushhour-replay
          cp README.md LICENSE dist/Rush-Hour/

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "Rush-Hour-${{ matrix.name }}.zip" Rush-Hour
          else
            tar czf "Rush-Hour-${{ matrix.name }}.tar.gz" Rush-Hour
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/Rush-Hour-${{ matrix.name }}.*
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum Rush-Hour-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rush Hour ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Rush-Hour-*
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
